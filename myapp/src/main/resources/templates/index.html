<div id="loadingDiv" style="display: none; text-align: center;">
    <p>인공지능이 주식 시그널을 생성 중입니다...  (*시간 최대 10분 소요*)</p>
    <div class="spinner">
        <img src="/img/loading.gif">
    </div> <!-- 로딩 애니메이션 -->
</div>

<div id="realtimeResult" style="display: none;">
    <!-- 서버 응답 내용이 여기에 표시됩니다 -->
</div>

<hr>


<script type="text/javascript">
    // 오늘 날짜를 자동으로 subject에 설정
    window.onload = function() {
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0]; // YYYY-MM-DD 형식
        document.getElementById("subject").value = "Signal Result - " + formattedDate;
    };

    // 폼 제출 전에 message에 div 내용을 동기화
    function syncMessage(event) {
        const resultDiv = document.getElementById("todayBuySellResult");
        const messageTextarea = document.getElementById("message");

        // div의 내용을 가져와서 textarea에 설정
        const divContent = resultDiv.innerText.trim();

        if (divContent === "") {
            alert("결과가 비어 있습니다. 'todayBuySellResult' 내용을 확인하세요.");
            event.preventDefault(); // 폼 제출 방지
            return;
        }

        messageTextarea.value = divContent;

        // 디버깅용 로그 (선택 사항)
        console.log("Message set to:", messageTextarea.value);
    }

var buttons = document.querySelectorAll("button[type=button]");


// 모든 버튼 클릭 시 다른 버튼 비활성화
buttons.forEach(function(button) {
button.addEventListener("click", function() {
    buttons.forEach(function(btn) {
        btn.disabled = true;
    });
});
});

// 오늘의 매수/매도 시그널
// 페이지 로드 시 서버에서 데이터를 받아와 출력
document.addEventListener("DOMContentLoaded", function () {
var resultDiv = document.getElementById("todayBuySellResult");

var xhr = new XMLHttpRequest();
xhr.open("POST", "/buysell_service", true); // POST 요청
xhr.setRequestHeader("Content-Type", "application/json");

// 서버 응답 처리
xhr.onload = function () {
    console.log(xhr.responseText); // 서버 응답 확인
    if (xhr.status >= 200 && xhr.status < 300) {
        try {
            var response = JSON.parse(xhr.responseText); // JSON 파싱
            resultDiv.innerHTML =
                "마지막 update 날짜 : " + response.date + "<br>" +
                "매수해야 할 주식 종목 (사세요) : " + response.buy + "<br>" +
                "매도해야 할 주식 종목 (파세요) : " + response.sell + "<br>";
        } catch (e) {
            resultDiv.innerHTML = "응답을 JSON으로 파싱할 수 없습니다.";
            console.error(e);
        }
    } else {
        console.error("Error: " + xhr.statusText);
        resultDiv.innerHTML = "POST 요청 중 오류가 발생했습니다.";
    }
};

// 네트워크 오류 처리
xhr.onerror = function () {
    resultDiv.innerHTML = "네트워크 오류가 발생했습니다.";
};

// 서버로 요청 데이터 전송 (빈 데이터)
xhr.send(); // 데이터 없이 요청 전송
});


// 오늘의 시그널
document.getElementById("todaySubmitButton").addEventListener("click", function () {
var form = document.getElementById("todayForm");
var formData = new FormData(form);
var stockName = formData.get("stock_name");
var resultDiv = document.getElementById("todayResult");

console.log(stockName);

<!--        alert(window.location.host);-->

var xhr = new XMLHttpRequest();
xhr.open("POST", "/today_service", true);
xhr.setRequestHeader("Content-Type", "application/json");

var requestData = JSON.stringify({
    stockName: stockName,
});

xhr.onload = function () {
    console.log(xhr.responseText); // 서버 응답 내용 확인
    if (xhr.status >= 200 && xhr.status < 300) {
        try {
            var response = JSON.parse(xhr.responseText);
            resultDiv.innerHTML =
                "시그널 : " + response.signal + "<br>" +
                "시그널 생성 기준 날짜 : " + response.date + "<br>" +
                response.suggestion;

                let p = document.createElement('p');
                p.innerHTML  = "<hr>" + '지난 시그널과 수익률 ⬇️⬇️⬇️';
                resultDiv.appendChild(p);

                var img_src = "data:image/png;base64," + response.graph;
                var img = document.createElement("img");
                img.src = img_src;
                resultDiv.appendChild(img);
        } catch (e) {
            resultDiv.innerHTML = "응답을 JSON으로 파싱할 수 없습니다.";
            console.error(e);
        }
    } else {
        console.error("Error: " + xhr.statusText);
        resultDiv.innerHTML = "POST는 갔는데 오류가 남.";
    }

    // 모든 버튼 다시 활성화
    buttons.forEach(function(btn) {
        btn.disabled = false;
    });

};

xhr.onerror = function () {
    resultDiv.innerHTML = "네트워크 오류가 발생했습니다.";
    buttons.forEach(function(btn) {
        btn.disabled = false;
    });
};

xhr.send(requestData);
});


// 실시간 분석
document.getElementById("realtimeSubmitButton").addEventListener("click", function () {
var form = document.getElementById("realtimeForm");
var formData = new FormData(form);
var stockName = formData.get("stock_name");
var close = formData.get("close");
var resultDiv = document.getElementById("realtimeResult");

console.log(stockName);

<!--        alert(window.location.host);-->

var loadingDiv = document.getElementById("loadingDiv"); // 로딩 중 표시할 DIV

var xhr = new XMLHttpRequest();
xhr.open("POST", "/realtime_service", true);
xhr.setRequestHeader("Content-Type", "application/json");

var requestData = JSON.stringify({
    stockName: stockName,
    close: close
});

// 로딩 화면 표시
loadingDiv.style.display = "block";
resultDiv.style.display = "none";

xhr.onload = function () {
    // 로딩 화면 숨김
    loadingDiv.style.display = "none";
    resultDiv.style.display = "block";

    console.log(xhr.responseText); // 서버 응답 내용 확인
    if (xhr.status >= 200 && xhr.status < 300) {
        try {
            var response = JSON.parse(xhr.responseText);
            resultDiv.innerHTML =
                "시그널 : " + response.signal + "<br>" +
                response.suggestion;

            let p = document.createElement('p');
            p.innerHTML  = "<hr>" + '지난 시그널과 수익률 ⬇️⬇️⬇️';
            resultDiv.appendChild(p);


            var img_src = "data:image/png;base64," + response.graph;
            var img = document.createElement("img");
            img.src = img_src;
            resultDiv.appendChild(img);
        } catch (e) {
            resultDiv.innerHTML = "응답을 JSON으로 파싱할 수 없습니다.";
            console.error(e);
        }
    } else {
        console.error("Error: " + xhr.statusText);
        resultDiv.innerHTML = "POST는 갔는데 오류가 남.";
    }

    // 모든 버튼 다시 활성화
    buttons.forEach(function(btn) {
        btn.disabled = false;
    });
};

xhr.onerror = function () {
    // 로딩 화면 숨김
    loadingDiv.style.display = "none";
    resultDiv.style.display = "block";
    resultDiv.innerHTML = "네트워크 오류가 발생했습니다.";
    buttons.forEach(function(btn) {
        btn.disabled = false;
    });
};

xhr.send(requestData);
});

document.getElementById('realtimeForm').addEventListener('keydown', function(event) {
if (event.key === 'Enter') {
    event.preventDefault(); // 폼 제출 방지
}
});

</script>
